# 每天 09:00（台灣）自動發 IG + FB 粉絲團限動。放在 Pages 倉庫的 .github/workflows/。
# 手動執行（Actions 頁 → Run workflow）預設只「試跑」；勾 publish 才真的發。
name: daily-story

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 台灣 09:00（GitHub 排程可能晚幾分鐘）
  workflow_dispatch:
    inputs:
      publish:
        description: "真的發布（不勾＝試跑）"
        type: boolean
        default: false
      date:
        description: "指定日期 YYYY-MM-DD（留空＝今天）"
        type: string
        default: ""
      ignore_start_date:
        description: "測試用：無視『12/21 才開始自動發』的保護（會真的發一則，記得事後手動刪）"
        type: boolean
        default: false
      platform:
        description: "發哪個平台（測試時可單獨測 fb 或 ig）"
        type: choice
        options: [both, fb, ig]
        default: both

permissions:
  contents: write   # 把 posted.json 存回倉庫（防重複發＋讓排程保持活躍）

concurrency:
  group: daily-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 發限動
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          STORIES_DIR: stories
          DO_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          DATE_ARG: ${{ inputs.date }}
          PLATFORM_ARG: ${{ inputs.platform }}
          IGNORE_START: ${{ inputs.ignore_start_date }}
        run: |
          ARGS=""
          if [ "$DO_PUBLISH" = "true" ]; then ARGS="$ARGS --publish"; fi
          if [ -n "$DATE_ARG" ]; then ARGS="$ARGS --date $DATE_ARG"; fi
          if [ "$IGNORE_START" = "true" ]; then ARGS="$ARGS --ignore-start"; fi
          if [ -n "$PLATFORM_ARG" ]; then ARGS="$ARGS --platform $PLATFORM_ARG"; fi
          node publish/publish-stories.js --check-url $ARGS
      - name: 存回發文紀錄
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          git config user.name "daily-story-bot"
          git config user.email "daily-story-bot@users.noreply.github.com"
          git add publish/posted.json || true
          git diff --cached --quiet || (git commit -m "posted $(date -u +%F)" && git push)
